<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homework Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Arsenal:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">UCU</span>
        <span>AI Homework</span>
      </a>
      <nav class="site-nav">
        <a href="#report">Report</a>
        <a id="repo-link" href="#" target="_blank" rel="noopener" hidden>Repository</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <section class="hero">
      <div class="container">
        <p class="eyebrow" id="meta-course">Ukrainian Catholic University</p>
        <h1 id="meta-title">Homework Report</h1>
        <dl class="meta" id="meta-list">
          <div class="meta-item" id="meta-author-wrap" hidden>
            <dt>Author</dt>
            <dd id="meta-author"></dd>
          </div>
          <div class="meta-item" id="meta-date-wrap" hidden>
            <dt>Date</dt>
            <dd id="meta-date"></dd>
          </div>
          <div class="meta-item meta-push">
            <dt>Last push</dt>
            <dd id="last-push">loading…</dd>
          </div>
        </dl>
      </div>
    </section>

    <section class="section" id="report">
      <div class="container report-layout">
        <aside class="toc" id="toc" aria-label="Contents" hidden>
          <p class="toc-title">Contents</p>
          <ol id="toc-list"></ol>
        </aside>
        <article class="report" id="report-body">
          <p class="muted">Loading report…</p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <span>Ukrainian Catholic University · Faculty of Applied Sciences</span>
      <span class="footer-note">Rendered from <code>report.md</code></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>

</html>
