[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hw2"
version = "0.1.0"
description = "UCU AI 2026 HW2: multi-object detection on VisDrone-VID"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hw2 = ["configs/*.yaml", "configs/*.csv"]
